[workspace]
members = ["crates/brainregiond"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/fanghaoling/brainregion"

[workspace.dependencies]
base64 = "0.22.1"
getrandom = "0.4.2"
hmac = "0.12.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
rmcp = { version = "3.1.2", default-features = false, features = ["client", "transport-async-rw"] }
tokio = { version = "1.51.1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
