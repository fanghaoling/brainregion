name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0  # v8 起不再发布 major tag（供应链安全），pin 到 immutable version
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test (pytest)
        run: uv run pytest tests/ -q

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Install MSRV toolchain
        if: runner.os == 'Linux'
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Check MSRV
        if: runner.os == 'Linux'
        run: cargo +1.88.0 check --workspace --all-targets --locked

      - name: Install uv for the real MCP probe
        if: runner.os == 'Linux'
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python for the real MCP probe
        if: runner.os == 'Linux'
        run: uv python install 3.12

      - name: Install Python worker dependencies
        if: runner.os == 'Linux'
        run: uv sync --extra dev --python 3.12

      - name: Test the real Python MCP worker and daemon shutdown
        if: runner.os == 'Linux'
        run: cargo test --locked -p brainregiond --test real_python_mcp -- --ignored --test-threads=1
